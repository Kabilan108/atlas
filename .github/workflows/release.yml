name: Release on Version Change

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.get_version.outputs.version }}
      latest_tag: ${{ steps.get_tag.outputs.latest_tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get current version from flake
        id: get_version
        run: |
          VERSION=$(nix eval .#default.version --raw)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Validate update metadata
        run: |
          go test ./internal/update

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"

      - name: Check if version changed
        id: check
        run: |
          CURRENT="${{ steps.get_version.outputs.version }}"
          LATEST="${{ steps.get_tag.outputs.latest_tag }}"

          # Remove 'v' prefix from tag if present
          LATEST=${LATEST#v}

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $LATEST -> $CURRENT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No version change detected"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push_image.outputs.image }}
      image_digest: ${{ steps.push_image.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary with Nix
        run: |
          nix build .#default -L

      - name: Build container image with Nix
        run: |
          nix build .#image -L -o image-stream
          ./image-stream > atlas-image.tar

      - name: Validate update metadata
        run: |
          go test ./internal/update

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          VERSION="${{ needs.check-version.outputs.current_version }}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ASSET="atlas-${GOOS}-${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "release-assets/${ASSET}" \
              ./cmd/atlas
            chmod +x "release-assets/${ASSET}"
          done
          (cd release-assets && sha256sum atlas-* > checksums.txt)

      - name: Write release notes
        run: |
          .github/scripts/release-notes.sh \
            "${{ needs.check-version.outputs.current_version }}" \
            "${{ needs.check-version.outputs.latest_tag }}" > release-notes.md
          cat release-notes.md

      - name: Push container image to GHCR
        id: push_image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/kabilan108/atlas:${{ needs.check-version.outputs.current_version }}"
          AUTHFILE="$RUNNER_TEMP/ghcr-auth.json"
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io --authfile "$AUTHFILE" \
            --username "${{ github.actor }}" --password-stdin
          # The runner has no /etc/containers/policy.json; the source is a local archive.
          skopeo --insecure-policy copy --authfile "$AUTHFILE" --digestfile image-digest \
            docker-archive:atlas-image.tar "docker://$IMAGE"
          DIGEST=$(cat image-digest)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Container image"
            echo
            echo "- Tag: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Pull by digest: \`ghcr.io/kabilan108/atlas@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$AUTHFILE"

      - name: Create and push tag
        run: |
          VERSION="${{ needs.check-version.outputs.current_version }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.current_version }}
          name: Release v${{ needs.check-version.outputs.current_version }}
          body_path: release-notes.md
          files: |
            release-assets/atlas-linux-amd64
            release-assets/atlas-linux-arm64
            release-assets/atlas-darwin-amd64
            release-assets/atlas-darwin-arm64
            release-assets/checksums.txt
          draft: false
          prerelease: false
